[project]
name = "riverlab-api"
version = "0.1.0"
description = "RiverLab backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0,<0.166",
    "uvicorn[standard]>=0.54.0,<0.55",
    "pydantic>=2.14.4,<3",
    "pydantic-settings>=2.16.3,<3",
    "sqlalchemy>=2.1.9,<2.2",
    "alembic>=1.20.1,<1.21",
    "psycopg[binary]>=3.3.9,<3.4",
    "riverlab-engine",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0,<10",
    "pytest-cov>=7.1.0,<8",
    "hypothesis>=6.170.17,<7",
    "httpx2>=2.16.2,<3",
    "ruff>=0.17.6,<0.18",
    "mypy>=2.4.1,<3",
    "phevaluator>=0.6.0,<0.7",
    "pokerkit>=0.7.8,<0.8",
]

[tool.uv.sources]
riverlab-engine = { path = "../engine/riverlab-py" }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/riverlab_api"]

[tool.pytest.ini_options]
testpaths = ["tests", "../tests/validation"]
addopts = "-ra --strict-markers"
markers = [
    "db: requires a PostgreSQL test database (RIVERLAB_TEST_DATABASE_URL)",
    "validation: cross-implementation checks against independent evaluators",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "C4", "SIM", "RUF", "PT"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N802"]
"../tests/**" = ["S"]
"alembic/**" = ["N999"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]
