[workspace]
resolver = "3"
members = [
    "poker-core",
    "hand-evaluator",
    "range-engine",
    "equity-engine",
    "solver-interface",
    "solver-validation",
    "solver-gtopen",
    "play-engine",
    "riverlab-py",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false
rust-version = "1.85"

[workspace.dependencies]
poker-core = { path = "poker-core" }
hand-evaluator = { path = "hand-evaluator" }
range-engine = { path = "range-engine" }
equity-engine = { path = "equity-engine" }
solver-interface = { path = "solver-interface" }
solver-validation = { path = "solver-validation" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
rand = { version = "=0.10.4", default-features = false, features = ["std"] }
rand_chacha = "=0.10.0"
proptest = "=1.12.0"
rayon = "=1.12.0"
pyo3 = { version = "=0.30.1", features = ["extension-module", "abi3-py312"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.test]
opt-level = 2
