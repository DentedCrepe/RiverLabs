[package]
name = "solver"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mimalloc = "0.1"
cudarc = { version = "0.19", default-features = false, features = [
    "driver",
    "nvrtc",
    "dynamic-loading",
    "cuda-12060",
], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[[bin]]
name = "solve-cli"
path = "src/bin/solve_cli.rs"

[features]
gpu = ["dep:cudarc"]
preflop-research = ["gpu"]
continuation-transfer-research = ["preflop-research", "serde_json/float_roundtrip"]
